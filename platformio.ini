; Membrane Switch Tester
; Board: ESP32-2432S028R ("Cheap Yellow Display", 2.8" ILI9341 + XPT2046 touch)
; Expander: PCF8574 / PCF8574A on CN1 (GPIO27 = SDA, GPIO22 = SCL)

[env:cyd]
platform = espressif32@6.9.0          ; Arduino core 2.0.x - TFT_eSPI is happiest here
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv

lib_deps =
    lvgl/lvgl@9.2.2
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

build_unflags = -std=gnu++11

build_flags =
    -Os
    -std=gnu++17
    ; ---- LVGL ----
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; ---- TFT_eSPI: configured here instead of editing User_Setup.h ----
    -DUSER_SETUP_LOADED=1
    ; Most CYD boards are ILI9341. If colours look inverted/odd, try ILI9341_DRIVER.
    ; The newer dual-USB (USB-C + micro) variant is often ST7789: use -DST7789_DRIVER=1 instead.
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000

; Some boards (often the dual-USB "CYD2USB" revision) show inverted colours.
; Build this env instead:  pio run -e cyd_inverted -t upload
; If the picture is garbled rather than just inverted, the panel is an ST7789:
; replace -DILI9341_2_DRIVER=1 with -DST7789_DRIVER=1 in [env:cyd].
[env:cyd_inverted]
extends = env:cyd
build_flags =
    ${env:cyd.build_flags}
    -DTFT_INVERSION_ON=1
